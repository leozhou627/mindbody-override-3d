      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:radial-gradient(circle at 50% 38%,#1b3436 0,#0c1517 70%);color:#e8c58a;

      #boot i{width:46px;height:58px;border-radius:48%;background:radial-gradient(circle at 50% 45%,#fff1cf,#e8c58a 55%,#b4823f);
        box-shadow:0 0 34px 10px rgba(240,176,70,.35);animation:boot 2.4s ease-in-out infinite}
      @keyframes boot{50%{box-shadow:0 0 50px 18px rgba(240,176,70,.5)}}
      @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
      html.light,html.light body{background:#f6f1e7}
      html.light #boot{background:radial-gradient(circle at 50% 38%,#fffaf0 0,#f6f1e7 70%);color:#926216}

    <!-- 階段 19：白天亮色、深夜深色（跟 src/lib/theme.ts 同一套規則），在畫面出來前就決定，不閃一下 -->

        if (p === 'light' || (p === 'auto' && h >= 5 && h < 21)) document.documentElement.classList.add('light')
      } catch (e) {}
